# ============================================================
# 보유 종목 가격 알림 — 예시 파일 (실제 설정은 여기에 적지 마세요)
#
# 저장소가 공개라서, 내가 실제로 가진 종목·평단·알림 가격은
# GitHub → Settings → Secrets and variables → Actions → New repository secret
#   이름: WATCH_CONFIG   값: 아래와 같은 형식의 내용
# 으로 등록합니다. Secret 이 있으면 이 파일은 쓰이지 않습니다.
#
# watches:
#   - code: "000000"          # 종목코드 6자리 (따옴표 필수)
#     name: 종목이름
#     avg_price: 100000       # 내 평단 (알림에 수익률 표시용)
#     alerts:
#       - {id: tp1, above: 120000, msg: "1차 익절 — 1/3 매도 검토"}
#       - {id: sl,  below: 95000,  msg: "보호선 이탈 — 정리 검토"}
#
# 알림은 id 마다 한 번씩만 옵니다. 다시 받으려면 id 를 바꾸세요 (예: tp1 → tp1b).
# ============================================================
watches: []
